<h2>Pendapatan Shift</h2>

<label>Billing</label>
<input type="number" id="billing">

<label>Snack</label>
<input type="number" id="snack">

<label>Minuman</label>
<input type="number" id="minuman">

<label>Rokok</label>
<input type="number" id="rokok">

<label>QRIS</label>
<input type="number" id="qris">

<label>Transfer</label>
<input type="number" id="transfer">

<button onclick="simpanPendapatan()">
  SIMPAN
</button>

<script>

function simpanPendapatan(){

  const billing =
  Number(
    document.getElementById('billing').value
  ) || 0;

  const snack =
  Number(
    document.getElementById('snack').value
  ) || 0;

  const minuman =
  Number(
    document.getElementById('minuman').value
  ) || 0;

  const rokok =
  Number(
    document.getElementById('rokok').value
  ) || 0;

  const qris =
  Number(
    document.getElementById('qris').value
  ) || 0;

  const transfer =
  Number(
    document.getElementById('transfer').value
  ) || 0;

  const totalPenjualan =
  billing + snack + minuman + rokok;

  const kasSeharusnya =
  totalPenjualan - qris - transfer;

  alert(
    'Total Penjualan : Rp ' +
    totalPenjualan +
    '\\nKas Seharusnya : Rp ' +
    kasSeharusnya
  );

}

</script>
