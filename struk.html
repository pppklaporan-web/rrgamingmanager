<!DOCTYPE html>
<html>
<head>

  <title>Struk</title>

  <style>

    body{
      font-family:monospace;
      width:280px;
      margin:auto;
      padding:10px;
    }

    .center{
      text-align:center;
    }

    hr{
      border:none;
      border-top:1px dashed #000;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
    }

    @media print {

      button{
        display:none;
      }
    }

  </style>

</head>
<body>

<div class="center">

  <h3>RR GAMING</h3>

  <small>
    Warnet & POS System
  </small>

</div>

<hr>

<div id="struk"></div>

<hr>

<div class="center">
  Terima Kasih
</div>

<button onclick="window.print()">
  🖨️ PRINT
</button>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

document.getElementById("struk")
.innerHTML = `

Tanggal :
${params.get("tanggal")}<br>

Jam :
${params.get("jam")}<br><br>

Operator :
${params.get("operator")}<br>

Shift :
${params.get("shift")}<br>

<hr>

TOTAL :
Rp ${Number(
  params.get("total")
).toLocaleString()}<br>

METODE :
${params.get("metode")}<br>

Keterangan :
${params.get("ket") || "-"}<br>

`;

window.onload = () => {
  window.print();
};

</script>

</body>
</html>
