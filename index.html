<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warnet Shift Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #020617, #0f172a, #111827);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: white;
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: #38bdf8;
      filter: blur(180px);
      opacity: 0.15;
      top: -150px;
      right: -150px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: #22c55e;
      filter: blur(180px);
      opacity: 0.1;
      bottom: -150px;
      left: -150px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 35px;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: auto;
      border-radius: 24px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(56,189,248,0.35);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .label {
      font-size: 14px;
      margin-bottom: 10px;
      display: block;
      color: #cbd5e1;
      font-weight: 500;
    }

    .shift-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    .shift-btn {
      border: 2px solid transparent;
      background: #111827;
      color: white;
      padding: 18px 10px;
      border-radius: 18px;
      cursor: pointer;
      transition: 0.25s;
      font-size: 15px;
      font-weight: 600;
    }

    .shift-btn:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .shift-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      box-shadow: 0 10px 25px rgba(14,165,233,0.3);
    }

    select,
    input {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #111827;
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 22px;
      transition: 0.25s;
    }

    select:focus,
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56,189,248,0.12);
    }

    .info-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    .start-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 10px 25px rgba(34,197,94,0.25);
    }

    .start-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #64748b;
      font-size: 12px;
    }

    @media(max-width: 480px) {
      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">

      <div class="logo">
        🎮
      </div>

      <h1>WARNET SHIFT</h1>
      <div class="subtitle">
        Sistem Operasional & Stock Management
      </div>

      <label class="label">Pilih Shift</label>

      <div class="shift-group">
        <button class="shift-btn active" onclick="pilihShift(this, 'PAGI')">
          ☀️<br>PAGI
        </button>

        <button class="shift-btn" onclick="pilihShift(this, 'MALAM')">
          🌙<br>MALAM
        </button>
      </div>

      <label class="label">Nama Operator</label>
      <select id="operator">
        <option value="">-- Pilih Operator --</option>
        <option>Feri</option>
        <option>Andi</option>
        <option>Miko</option>
      </select>

      <label class="label">Uang Awal Laci</label>
      <input type="number" id="uangAwal" placeholder="Contoh: 500000">

      <label class="label">Jumlah Koin</label>
      <input type="number" id="koin" placeholder="Contoh: 120000">

      <div class="info-box">
        <div class="info-item">
          <span>Tanggal</span>
          <span id="tanggal"></span>
        </div>

        <div class="info-item">
          <span>Jam Masuk</span>
          <span id="jam"></span>
        </div>

        <div class="info-item">
          <span>Status</span>
          <span style="color:#22c55e; font-weight:600;">
            SIAP SHIFT
          </span>
        </div>
      </div>

      <button class="start-btn" onclick="mulaiShift()">
        MULAI SHIFT
      </button>

      <div class="footer">
        Warnet Management System v1.0
      </div>

    </div>
  </div>

  <script>
    let selectedShift = 'PAGI';

    function pilihShift(button, shift) {
      document.querySelectorAll('.shift-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      button.classList.add('active');
      selectedShift = shift;
    }

    function updateJam() {
      const now = new Date();

      const tanggal = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      const jam = now.toLocaleTimeString('id-ID');

      document.getElementById('tanggal').innerText = tanggal;
      document.getElementById('jam').innerText = jam;
    }

    setInterval(updateJam, 1000);
    updateJam();

    function mulaiShift() {
      const operator = document.getElementById('operator').value;
      const uangAwal = document.getElementById('uangAwal').value;
      const koin = document.getElementById('koin').value;

      if (!operator) {
        alert('Pilih operator terlebih dahulu');
        return;
      }

      if (!uangAwal) {
        alert('Isi uang awal laci');
        return;
      }

      if (!koin) {
        alert('Isi jumlah koin');
        return;
      }

      const dataShift = {
        shift: selectedShift,
        operator,
        uangAwal,
        koin,
        waktu: new Date()
      };

      fetch('https://script.google.com/macros/s/AKfycbzXZB1p_rOiirz6eYJhQLcOwh5u1PUA4mW2YWeIwhgErqHOgCnxyCzXhRW-iYng9MhxuQ/exec', {

  method:'POST',

  body:JSON.stringify(dataShift)

})
.then(res => res.json())
.then(response => {

  localStorage.setItem(
    'id_shift',
    response.id_shift
  );

  localStorage.setItem(
    'operator',
    operator
  );

  localStorage.setItem(
    'shift',
    selectedShift
  );

  alert(
    'SHIFT BERHASIL DIMULAI'
  );

  window.location.href =
  'dashboard.html';

})
.catch(err => {

  alert(
    'Gagal menyimpan data'
  );

  console.log(err);

});

      alert(
        'SHIFT BERHASIL DIMULAI\n\n' +
        'Operator : ' + operator + '\n' +
        'Shift : ' + selectedShift
      );

      // Nanti diarahkan ke dashboard shift
      // window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
