<!DOCTYPE html>
<html>
<head>
  <title>POS SYSTEM</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#111827">

  <link rel="manifest"
        href="manifest.json">

  <style>

    body{
      font-family: Arial;
      padding: 10px;
      background: #f5f5f5;
    }

    h2,h3{
      margin-top: 10px;
    }

    .box{
      background: white;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    input,select{
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    button{
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:hover{
      opacity: 0.9;
    }

    .admin-only{
      background: #fff8dc;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    #app{
      display:none;
    }

  </style>
</head>

<body>

<h2>POS SYSTEM LIVE</h2>

<!-- =========================
     ADMIN PANEL
========================= -->
<div class="admin-only">

  <h3>⚙️ ADMIN PANEL</h3>

  <button onclick="tambahOperatorUI()">
    Tambah Operator
  </button>

  <button>
    Reset Data
  </button>

  <button>
    Export Laporan
  </button>

</div>

<!-- =========================
     LOGIN
========================= -->
<div id="loginBox" class="box">

  <h3>🔐 LOGIN OPERATOR</h3>

  Username
  <input id="username">

  PIN
  <input id="pin" type="password">

  <button onclick="login()">
    LOGIN
  </button>

</div>

<!-- =========================
     APP
========================= -->
<div id="app">

  <div class="box">

    <div id="welcome"></div>

    <div id="operatorInfo"></div>

    <button onclick="logout()">
      LOGOUT
    </button>

  </div>

  <!-- =========================
       SHIFT
  ========================= -->
  <div class="box">

    <h3>SHIFT</h3>

    <select id="shift">
      <option>PAGI</option>
      <option>MALAM</option>
    </select>

  </div>

  <!-- =========================
       STOCK
  ========================= -->
  <h3>📦 STOCK OPNAME</h3>

  <div id="stockList"></div>

  <button onclick="simpanStock()">
    Simpan Stock
  </button>

  <hr>

  <!-- =========================
       TRANSAKSI
  ========================= -->
  <h3>💰 INPUT PENDAPATAN</h3>

  <div class="box">

    Total
    <input id="total" type="number">

    Metode
    <select id="metode">
      <option value="TUNAI">TUNAI</option>
      <option value="QRIS">QRIS</option>
    </select>

    Kas Laci (Auto)
    <input id="autoKas"
           value="0"
           readonly>

    Keterangan
    <input id="ket">

    <button onclick="simpanAll()">
      SIMPAN
    </button>

  </div>

  <!-- =========================
       SERAH TERIMA
  ========================= -->
  <h3>🔁 SERAH TERIMA SHIFT</h3>

  <div class="box">

    Operator Dari
    <input id="from">

    Operator Ke
    <input id="to">

    Shift
    <select id="shiftST">
      <option>PAGI</option>
      <option>MALAM</option>
    </select>

    Catatan
    <input id="catatan">

    <button onclick="serahTerima()">
      Proses Serah Terima
    </button>

  </div>

  <!-- =========================
       SELISIH KAS
  ========================= -->
  <h3>⚠️ CEK SELISIH KAS</h3>

  <div class="box">

    Kas Fisik
    <input id="saldoFisik"
           type="number">

    Catatan
    <input id="catatanSelisih">

    <button onclick="cekSelisihKasUI()">
      CEK SELISIH
    </button>

  </div>

</div>

<!-- =========================
     SCRIPT
========================= -->
<script>

let barang = [];

/* =========================
   INIT
========================= */
window.onload = function(){

  const op =
    JSON.parse(
      sessionStorage.getItem("operator")
    );

  if(!op){

    document.getElementById("loginBox")
      .style.display = "block";

    document.getElementById("app")
      .style.display = "none";

    return;
  }

  document.getElementById("loginBox")
    .style.display = "none";

  document.getElementById("app")
    .style.display = "block";

  document.getElementById("welcome")
    .innerText =
      "Selamat datang " +
      op.nama +
      " (" + op.role + ")";

  document.getElementById("operatorInfo")
    .innerText =
      "Operator Aktif: " + op.nama;

  applyRoleAccess(op.role);

  loadBarang();
};

/* =========================
   LOGIN
========================= */
function login(){

  const username =
    document.getElementById("username").value;

  const pin =
    document.getElementById("pin").value;

  google.script.run
    .withSuccessHandler(res => {

      if(res.success){

        sessionStorage.setItem(
          "operator",
          JSON.stringify(res)
        );

        location.reload();

      }else{

        alert("Login gagal");

      }

    })
    .loginOperator(username, pin);
}

/* =========================
   LOGOUT
========================= */
function logout(){

  sessionStorage.removeItem("operator");

  location.reload();
}

/* =========================
   ROLE ACCESS
========================= */
function applyRoleAccess(role){

  if(role === "OPERATOR"){

    const adminMenu =
      document.querySelectorAll(".admin-only");

    adminMenu.forEach(el => {
      el.style.display = "none";
    });

  }
}

/* =========================
   LOAD BARANG
========================= */
function loadBarang(){

  google.script.run
    .withSuccessHandler(res => {

      barang = res;

      renderStock();

    })
    .getBarang();
}

/* =========================
   RENDER STOCK
========================= */
function renderStock(){

  let html = "";

  barang.forEach((b,i) => {

    html += `

      <div class="box">

        <b>${b.nama}</b><br><br>

        Awal
        <input id="awal_${i}"
               type="number"
               value="0">

        Akhir
        <input id="akhir_${i}"
               type="number"
               value="0">

      </div>

    `;
  });

  document.getElementById("stockList")
    .innerHTML = html;
}

/* =========================
   SIMPAN STOCK
========================= */
function simpanStock(){

  const op =
    JSON.parse(
      sessionStorage.getItem("operator")
    );

  const items = barang.map((b,i) => ({

    id_barang: b.id,

    stok_awal:
      parseInt(
        document.getElementById("awal_" + i).value
      ) || 0,

    stok_akhir:
      parseInt(
        document.getElementById("akhir_" + i).value
      ) || 0

  }));

  const data = {

    operator: op.nama,

    shift:
      document.getElementById("shift").value,

    tanggal:
      new Date().toLocaleDateString(),

    items: items
  };

  google.script.run
    .withSuccessHandler(res => {

      alert(
        "Stock tersimpan\nID: " +
        res.id_stock
      );

    })
    .simpanStock(data);
}

/* =========================
   SIMPAN TRANSAKSI
========================= */
function simpanAll(){

  const op =
    JSON.parse(
      sessionStorage.getItem("operator")
    );

  const data = {

    tanggal:
      new Date().toLocaleDateString(),

    jam:
      new Date().toLocaleTimeString(),

    operator:
      op.nama,

    shift:
      document.getElementById("shift").value,

    total:
      parseInt(
        document.getElementById("total").value
      ) || 0,

    metode:
      document.getElementById("metode").value,

    keterangan:
      document.getElementById("ket").value
  };

  google.script.run
    .withSuccessHandler(res => {

      alert(
        "TRX sukses\n\n" +
        "ID: " + res.id +
        "\nSaldo: " + res.saldo_akhir
      );

    })
    .saveTransaksiDanKas(data);
}

/* =========================
   SERAH TERIMA
========================= */
function serahTerima(){

  const data = {

    tanggal:
      new Date().toLocaleDateString(),

    shift:
      document.getElementById("shiftST").value,

    dari:
      document.getElementById("from").value,

    ke:
      document.getElementById("to").value,

    catatan:
      document.getElementById("catatan").value
  };

  google.script.run
    .withSuccessHandler(res => {

      alert(
        "Serah terima sukses\nID: " +
        res.id
      );

    })
    .saveSerahTerima(data);
}

/* =========================
   TAMBAH OPERATOR
========================= */
function tambahOperatorUI(){

  const op =
    JSON.parse(
      sessionStorage.getItem("operator")
    );

  const data = {

    id:
      "OP_" + Date.now(),

    nama:
      prompt("Nama Operator"),

    username:
      prompt("Username"),

    pin:
      prompt("PIN"),

    role:
      prompt("Role (ADMIN/OPERATOR)")
  };

  google.script.run
    .withSuccessHandler(() => {

      alert(
        "Operator berhasil ditambah"
      );

    })
    .tambahOperator(data, op);
}

/* =========================
   CEK SELISIH KAS
========================= */
function cekSelisihKasUI(){

  const op =
    JSON.parse(
      sessionStorage.getItem("operator")
    );

  const data = {

    tanggal:
      new Date().toLocaleDateString(),

    operator:
      op.nama,

    shift:
      document.getElementById("shift").value,

    saldo_fisik:
      document.getElementById("saldoFisik").value,

    catatan:
      document.getElementById("catatanSelisih").value
  };

  google.script.run
    .withSuccessHandler(res => {

      if(res.status === "SELISIH"){

        alert(

          "⚠️ SELISIH KAS!\n\n" +

          "Sistem: Rp " +
          res.saldoSistem +

          "\nFisik: Rp " +
          res.saldoFisik +

          "\nSelisih: Rp " +
          res.selisih

        );

      }else{

        alert("✅ Kas Aman");

      }

    })
    .cekSelisihKas(data);
}

</script>

<!-- =========================
     SERVICE WORKER
========================= -->
<script>

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("service-worker.js")

    .then(() => {

      console.log(
        "Service Worker Registered"
      );

    });

}

</script>

</body>
</html>
```
