<!DOCTYPE html>
<html>

<head>

  <title>GameCafe Manager</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>

    body{
      font-family: Arial;
      background:#111;
      color:white;
      padding:20px;
    }

    h1{
      color:orange;
    }

    .card{
      background:#222;
      padding:15px;
      margin-bottom:10px;
      border-radius:10px;
    }

    button{
      background:orange;
      border:none;
      padding:10px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

  </style>

</head>

<body>

<h1>GameCafe Manager</h1>

<div id="dataBarang">

  Loading...

</div>

<script>

const URL =
"https://script.google.com/macros/s/AKfycbxjfcqg7_1T3rBHQe-YSPZea0y8T-iiG2P9GdQxrjT012CwncPWcOafB1ECL1ztcH5I/exec";


// AMBIL DATA BARANG

fetch(URL)

.then(res => res.json())

.then(data => {

  let html = "";

  data.forEach(item => {

    html += `
    
    <div class="card">

      <h3>${item.nama_barang}</h3>

      <p>Kategori :
      ${item.kategori}</p>

      <p>Stok :
      ${item.stok}</p>

      <p>Harga :
      Rp ${item.harga}</p>

      <button onclick="jualBarang(${item.id})">

        JUAL 1

      </button>

    </div>
    
    `;

  });

  document
  .getElementById("dataBarang")
  .innerHTML = html;

})

.catch(error => {

  console.log(error);

});


// FUNGSI JUAL BARANG

function jualBarang(id){

  fetch(URL, {

    method:"POST",

    body: JSON.stringify({
      id:id,
      qty:1
    })

  })

  .then(res => res.json())

  .then(data => {

    alert("Barang terjual");

    location.reload();

  })

  .catch(error => {

    console.log(error);

  });

}

</script>

</body>
</html>
