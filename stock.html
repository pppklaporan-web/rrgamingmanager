<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Opname</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:
  linear-gradient(135deg,#020617,#0f172a,#111827);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
}

.container{
  width:100%;
  max-width:550px;
}

.card{
  background:rgba(15,23,42,0.9);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:28px;
  padding:30px;
  backdrop-filter:blur(12px);
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h2{
  font-size:28px;
  margin-bottom:8px;
}

.title p{
  color:#94a3b8;
  font-size:14px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
}

input{
  width:100%;
  padding:14px 16px;
  border:none;
  outline:none;
  border-radius:16px;
  background:#111827;
  color:white;
  font-size:16px;
  border:1px solid rgba(255,255,255,0.05);
}

button{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:none;
  border-radius:18px;
  background:
  linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="title">
      <h2>📦 Stock Opname</h2>
      <p>Input stock barang shift</p>
    </div>

    <div class="form-group">
      <label>Slava</label>
      <input type="number" id="slava" placeholder="0">
    </div>

    <div class="form-group">
      <label>Surya</label>
      <input type="number" id="surya" placeholder="0">
    </div>

    <div class="form-group">
      <label>Sampoerna</label>
      <input type="number" id="sampoerna" placeholder="0">
    </div>

    <div class="form-group">
      <label>M4000</label>
      <input type="number" id="m4000" placeholder="0">
    </div>

    <div class="form-group">
      <label>M5000</label>
      <input type="number" id="m5000" placeholder="0">
    </div>

    <div class="form-group">
      <label>M6000</label>
      <input type="number" id="m6000" placeholder="0">
    </div>

    <div class="form-group">
      <label>Snack</label>
      <input type="number" id="snack" placeholder="0">
    </div>

    <button onclick="simpanStock()">
      SIMPAN STOCK
    </button>

  </div>

</div>

<script>

function simpanStock(){

  const dataStock = {

    action:'stock',

    id_shift:
    localStorage.getItem('id_shift'),

    operator:
    localStorage.getItem('operator'),

    shift:
    localStorage.getItem('shift'),

    slava:
    Number(document.getElementById('slava').value) || 0,

    surya:
    Number(document.getElementById('surya').value) || 0,

    sampoerna:
    Number(document.getElementById('sampoerna').value) || 0,

    m4000:
    Number(document.getElementById('m4000').value) || 0,

    m5000:
    Number(document.getElementById('m5000').value) || 0,

    m6000:
    Number(document.getElementById('m6000').value) || 0,

    snack:
    Number(document.getElementById('snack').value) || 0

  };

  fetch(
    'https://script.google.com/macros/s/AKfycbzXZB1p_rOiirz6eYJhQLcOwh5u1PUA4mW2YWeIwhgErqHOgCnxyCzXhRW-iYng9MhxuQ/exec',
    {

      method:'POST',

      body:JSON.stringify(dataStock)

    }
  )

  .then(res => res.json())

  .then(response => {

    alert(
      'Stock berhasil disimpan'
    );

    console.log(response);

  })

  .catch(err => {

    console.log(err);

    alert(
      'Gagal menyimpan stock'
    );

  });

}

</script>

</body>
</html>
